###############################################################################
#                                INPUT PLUGIN                                 #
###############################################################################
[[inputs.tail]]
  files           = ["/var/lib/telegraf/csv/*.csv"]
  from_beginning  = true
  name_override   = "gate_tokens"

  data_format                = "csv"
  csv_header_row_count       = 1
  csv_timestamp_column       = "datetime"
  csv_timestamp_format       = "2006-01-02 15:04:05"

  # Make your string dimensions filterable in Grafana:
  csv_tag_columns = ["model","TerminalID","MoveType","Desig","active_model","temporal_validation","deployment_status","model_stability"]

  # (optional, but recommended) lock numeric types:
  csv_column_types = [
    "TerminalID:string","MoveType:string","Desig:string",
    "actual:float","prediction:float","error:float","abs_error:float","pct_error:float",
    "mse:float","rmse:float","mae:float","mape:float","accuracy:float","r2:float",
    "model:string","active_model:string","temporal_validation:boolean",
    "deployment_status:string","validation_rmse:float","model_stability:string",
    "test_rmse:float","test_mae:float","test_mape:float","test_r2:float"
  ]

###############################################################################
#                               OUTPUT PLUGIN                                 #
###############################################################################
[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "${INFLUX_TOKEN}"
  organization = "ports"
  bucket       = "${INFLUX_BUCKET}"    # gate_tokens_raw during backfill; gate_tokens for steady state
