version: '3.8'
services:

  influxdb:
    image: influxdb:2.6
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin12345
      - DOCKER_INFLUXDB_INIT_ORG=ports
      - DOCKER_INFLUXDB_INIT_BUCKET=gate_tokens
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=inflxAdm1nT0k3n123
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/health | grep -q '\"status\":\"pass\"'"]
      interval: 30s
      timeout: 5s
      retries: 3

  telegraf:
    image: telegraf:1.27
    container_name: telegraf
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      - INFLUX_TOKEN=inflxAdm1nT0k3n123
      # ---------- PHASE 1 (backfill): write to infinite-retention bucket ----------
      - INFLUX_BUCKET=gate_tokens_raw
      # ---------- PHASE 2 (steady state): change to gate_tokens ----------
      # - INFLUX_BUCKET=gate_tokens
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./data/dashboard_data:/var/lib/telegraf/csv:ro
      - telegraf_state:/var/lib/telegraf
    healthcheck:
      # parses CSV (doesn't hit Influx); good enough to catch config errors
      test: ["CMD-SHELL", "telegraf --test --input-filter tail --config /etc/telegraf/telegraf.conf | head -n1"]
      interval: 1m
      timeout: 10s
      retries: 2

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health | grep -q '\"database\":.*\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  influxdb_data:
  telegraf_state:
